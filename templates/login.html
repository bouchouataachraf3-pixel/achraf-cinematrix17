{% extends "auth_base.html" %}
{% block title %}Connexion · CINEMATRIX{% endblock %}
{% block tagline %}Identifiez-vous pour entrer en scène{% endblock %}
{% block auth_content %}
<form method="post" novalidate>
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label class="field">
    <span>Nom d'utilisateur ou email</span>
    <input type="text" name="identifier" value="{{ identifier }}" autocomplete="username" required autofocus>
  </label>
  <label class="field">
    <span>Mot de passe</span>
    <div class="pwd">
      <input type="password" name="password" autocomplete="current-password" required>
      <button type="button" class="toggle-pwd" aria-label="Afficher le mot de passe">👁</button>
    </div>
  </label>
  <div class="row-between">
    <label class="check"><input type="checkbox" name="remember"> <span>Se souvenir de moi</span></label>
    <a href="{{ url_for('forgot_password') }}">Mot de passe oublié ?</a>
  </div>
  <button class="btn btn-block" type="submit">Se connecter</button>
</form>
<p class="auth-alt">Nouveau ici ? <a href="{{ url_for('register') }}">Créer un compte</a></p>
{% endblock %}
