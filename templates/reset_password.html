{% extends "auth_base.html" %}
{% block title %}Nouveau mot de passe · CINEMATRIX{% endblock %}
{% block tagline %}Choisissez un nouveau mot de passe{% endblock %}
{% block auth_content %}
<form method="post" novalidate>
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label class="field">
    <span>Nouveau mot de passe</span>
    <div class="pwd">
      <input type="password" name="password" id="pwd-main" autocomplete="new-password" required minlength="8" autofocus>
      <button type="button" class="toggle-pwd" aria-label="Afficher le mot de passe">👁</button>
    </div>
    <div class="strength" data-for="pwd-main"><i></i><i></i><i></i><i></i></div>
    <small class="hint">8 caractères minimum, avec lettres et chiffres.</small>
  </label>
  <label class="field">
    <span>Confirmer le mot de passe</span>
    <input type="password" name="confirm" autocomplete="new-password" required>
  </label>
  <button class="btn btn-block" type="submit">Réinitialiser</button>
</form>
<p class="auth-alt"><a href="{{ url_for('login') }}">← Retour à la connexion</a></p>
{% endblock %}
